<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Project Manager Editor</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            overflow: hidden;
            font-family: Arial, sans-serif;
            background: #1e1e1e;
            color: #ffffff;
        }

        .topbar {
            height: 48px;
            display: flex;
            align-items: center;
            gap: 8px;
            padding: 0 12px;
            background: #252526;
            border-bottom: 1px solid #3f3f46;
        }

        .title {
            font-weight: bold;
            margin-right: 12px;
        }

        button {
            border: 1px solid #555;
            background: #333;
            color: #fff;
            padding: 6px 10px;
            border-radius: 4px;
            cursor: pointer;
        }

        button:hover {
            background: #444;
        }

        button.primary {
            background: #0e639c;
            border-color: #1177bb;
        }

        button.danger {
            background: #7f1d1d;
        }

        .workspace {
            display: flex;
            height: calc(100vh - 74px);
            width: 100%;
        }

        .sidebar {
            width: 250px;
            min-width: 180px;
            background: #252526;
            border-right: 1px solid #3f3f46;
            display: flex;
            flex-direction: column;
        }

        .sidebar-header {
            padding: 10px;
            border-bottom: 1px solid #3f3f46;
            font-weight: bold;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .resize-handle {
            width: 4px;
            cursor: col-resize;
            background: transparent;
            transition: background 0.2s;
        }

        .resize-handle:hover {
            background: #0e639c;
        }

        .tree {
            flex: 1;
            overflow-y: auto;
            padding: 8px;
        }

        .tree-item {
            user-select: none;
            cursor: pointer;
            padding: 4px 6px;
            border-radius: 3px;
        }

        .tree-item:hover {
            background: #2a2d2e;
        }

        .tree-item.selected {
            background: #094771;
        }

        .children {
            margin-left: 12px;
        }

        .editor-area {
            flex: 1;
            display: flex;
            flex-direction: column;
            min-width: 0;
            height: 100%;
        }

        .filebar {
            height: 40px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 12px;
            background: #1f1f1f;
            border-bottom: 1px solid #3f3f46;
        }

        #unsavedIndicator {
            color: #e2c08d;
            font-size: 12px;
            font-weight: bold;
            margin-left: 8px;
        }

        #editor {
            flex: 1;
            width: 100%;
            height: 100%;
            background: #1e1e1e;
        }

        .statusbar {
            height: 26px;
            display: flex;
            align-items: center;
            padding: 0 10px;
            background: #007acc;
            color: white;
            font-size: 12px;
        }

        .status-message {
            flex: 1;
        }
    </style>

    <!-- Monaco Loader CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs/loader.min.js"></script>
</head>
<body>

<div class="topbar">
    <div class="title">Project Manager Editor</div>
    <button onclick="goHome()">🏠 Home</button>
    <button class="primary" onclick="saveFile()">Save</button>
    <button onclick="newFile()">+ File</button>
    <button onclick="newFolder()">+ Folder</button>
    <button onclick="renameSelected()">Rename</button>
    <button class="danger" onclick="deleteSelected()">Delete</button>
    <button onclick="refreshTree()">Refresh</button>
</div>

<div class="workspace">
    <div class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <span>PROJECT FILES</span>
        </div>
        <div id="tree" class="tree">Loading...</div>
    </div>
    
    <div class="resize-handle" id="resizeHandle"></div>

    <div class="editor-area">
        <div class="filebar">
            <div>
                <span id="currentFile">No file selected</span>
                <span id="unsavedIndicator"></span>
            </div>
            <div id="language">plaintext</div>
        </div>
        <div id="editor"></div>
    </div>
</div>

<div class="statusbar">
    <div id="statusMessage" class="status-message">Initializing...</div>
</div>

<script>
/* ============================================================
   GLOBAL STATE
   ============================================================ */

let editor = null;
let currentFile = null;
let currentLanguage = "plaintext";
let isDirty = false;
let projectTree = [];

/* ============================================================
   NAVIGATION
   ============================================================ */

function goHome() {
    if (isDirty) {
        const proceed = confirm("You have unsaved changes. Return to home?");
        if (!proceed) return;
    }
    window.location.href = "/";
}

/* ============================================================
   LANGUAGE DETECTION MAP
   ============================================================ */

function getLanguage(filePath) {
    if (!filePath) return "plaintext";
    const ext = filePath.split(".").pop().toLowerCase();
    const map = {
        py: "python",
        js: "javascript",
        jsx: "javascript",
        ts: "typescript",
        tsx: "typescript",
        html: "html",
        htm: "html",
        css: "css",
        json: "json",
        md: "markdown",
        yaml: "yaml",
        yml: "yaml",
        sql: "sql",
        xml: "xml",
        sh: "shell",
        env: "shell",
        txt: "plaintext"
    };
    return map[ext] || "plaintext";
}

/* ============================================================
   MONACO INITIALIZATION
   ============================================================ */

if (typeof require !== 'undefined') {
    require.config({
        paths: {
            vs: "https://cdnjs.cloudflare.com/ajax/libs/monaco-editor/0.52.2/min/vs"
        }
    });

    require(["vs/editor/editor.main"], function () {
        editor = monaco.editor.create(document.getElementById("editor"), {
            value: "// Select a file from the sidebar to start editing\n",
            language: "plaintext",
            theme: "vs-dark",
            automaticLayout: true,
            minimap: { enabled: true },
            wordWrap: "on",
            fontSize: 14,
            
            // Indentation & Auto-formatting controls
            tabSize: 4,
            insertSpaces: true,
            autoIndent: "full",
            formatOnType: true,
            formatOnPaste: true
        });

        editor.onDidChangeModelContent(function () {
            if (!currentFile) return;
            isDirty = true;
            updateDirtyIndicator();
        });

        setStatus("Ready");

        loadProject().then(() => {
            const urlParams = new URLSearchParams(window.location.search);
            const initialPath = urlParams.get("path");
            if (initialPath) {
                openFile(initialPath);
            }
        });
    });
} else {
    setStatus("Error: Could not load Monaco CDN loader script.");
}

/* ============================================================
   PROJECT TREE & FILESYSTEM OPERATIONS
   ============================================================ */

async function loadProject() {
    setStatus("Loading project...");
    try {
        const response = await fetch("/api/project");
        if (!response.ok) throw new Error("Could not load project.");

        const data = await response.json();
        projectTree = data.filesystem || [];
        renderTree();
        setStatus("Project loaded.");
    } catch (error) {
        setStatus("Error: " + error.message);
    }
}

function renderTree() {
    const tree = document.getElementById("tree");
    tree.innerHTML = "";
    renderItems(projectTree, tree);
}

function renderItems(items, container) {
    for (const item of items) {
        const row = document.createElement("div");
        row.className = "tree-item";

        if (item.type === "directory") {
            row.classList.add("folder");
            row.textContent = "📁 " + item.name;
            container.appendChild(row);

            const children = document.createElement("div");
            children.className = "children";
            container.appendChild(children);

            renderItems(item.children || [], children);
        } else {
            row.textContent = "📄 " + item.name;
            if (currentFile === item.path) {
                row.classList.add("selected");
            }

            row.onclick = function () {
                openFile(item.path);
            };

            container.appendChild(row);
        }
    }
}

async function openFile(filePath) {
    if (isDirty) {
        const proceed = confirm("You have unsaved changes. Open another file?");
        if (!proceed) return;
    }

    setStatus("Opening " + filePath + "...");

    try {
        const response = await fetch("/api/file/read?path=" + encodeURIComponent(filePath));
        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || "Could not read file.");
        }

        const data = await response.json();
        currentFile = filePath;
        currentLanguage = getLanguage(filePath);

        if (editor) {
            editor.setValue(data.content);
            monaco.editor.setModelLanguage(editor.getModel(), currentLanguage);
        }

        isDirty = false;
        updateFileDisplay();
        renderTree();
        setStatus("Opened " + filePath);
    } catch (error) {
        setStatus("Error: " + error.message);
        alert(error.message);
    }
}

async function saveFile() {
    if (!currentFile || !editor) {
        alert("No file is currently open.");
        return;
    }

    setStatus("Saving...");

    try {
        const response = await fetch("/api/file/write", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                path: currentFile,
                content: editor.getValue()
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || "Could not save file.");
        }

        isDirty = false;
        updateDirtyIndicator();
        setStatus("Saved " + currentFile);
        await refreshTree();
    } catch (error) {
        setStatus("Save error: " + error.message);
        alert(error.message);
    }
}

async function newFile() {
    const fileName = prompt("Enter new file path/name:");
    if (!fileName) return;

    try {
        const response = await fetch("/api/file/create", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                path: fileName,
                content: ""
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || "Could not create file.");
        }

        await refreshTree();
        await openFile(fileName);
        setStatus("Created " + fileName);
    } catch (error) {
        alert(error.message);
    }
}

async function newFolder() {
    const folderPath = prompt("Enter new folder path:");
    if (!folderPath) return;

    try {
        const response = await fetch("/api/directory/create?path=" + encodeURIComponent(folderPath), {
            method: "POST"
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || "Could not create folder.");
        }

        await refreshTree();
        setStatus("Created folder " + folderPath);
    } catch (error) {
        alert(error.message);
    }
}

async function renameSelected() {
    if (!currentFile) {
        alert("Select a file first.");
        return;
    }

    const newName = prompt("Enter the new file path:", currentFile);
    if (!newName || newName === currentFile) return;

    try {
        const response = await fetch("/api/path/rename", {
            method: "PUT",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                old_path: currentFile,
                new_path: newName
            })
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || "Could not rename file.");
        }

        currentFile = newName;
        await refreshTree();
        await openFile(newName);
    } catch (error) {
        alert(error.message);
    }
}

async function deleteSelected() {
    if (!currentFile) {
        alert("Select a file first.");
        return;
    }

    const confirmed = confirm("Delete " + currentFile + "?");
    if (!confirmed) return;

    try {
        const response = await fetch("/api/file/delete?path=" + encodeURIComponent(currentFile), {
            method: "DELETE"
        });

        if (!response.ok) {
            const error = await response.json();
            throw new Error(error.detail || "Could not delete file.");
        }

        currentFile = null;
        editor.setValue("");
        isDirty = false;
        updateFileDisplay();
        await refreshTree();
        setStatus("File deleted.");
    } catch (error) {
        alert(error.message);
    }
}

async function refreshTree() {
    await loadProject();
}

/* ============================================================
   UI UPDATES & UTILITIES
   ============================================================ */

function updateFileDisplay() {
    document.getElementById("currentFile").textContent = currentFile ? currentFile : "No file selected";
    document.getElementById("language").textContent = currentLanguage;
    updateDirtyIndicator();
}

function updateDirtyIndicator() {
    document.getElementById("unsavedIndicator").textContent = isDirty ? "● UNSAVED" : "";
}

function setStatus(message) {
    document.getElementById("statusMessage").textContent = message;
}

/* ============================================================
   KEYBOARD SHORTCUTS & SIDEBAR RESIZE
   ============================================================ */

document.addEventListener("keydown", function (event) {
    if ((event.ctrlKey || event.metaKey) && event.key.toLowerCase() === "s") {
        event.preventDefault();
        saveFile();
    }
});

const sidebar = document.getElementById("sidebar");
const resizeHandle = document.getElementById("resizeHandle");
let resizing = false;

resizeHandle.addEventListener("mousedown", function () {
    resizing = true;
    document.body.style.cursor = "col-resize";
});

document.addEventListener("mousemove", function (event) {
    if (!resizing) return;
    const width = event.clientX;
    if (width >= 180 && width <= 500) {
        sidebar.style.width = width + "px";
        if (editor) editor.layout();
    }
});

document.addEventListener("mouseup", function () {
    resizing = false;
    document.body.style.cursor = "";
});

window.addEventListener("beforeunload", function (event) {
    if (!isDirty) return;
    event.preventDefault();
    event.returnValue = "";
});
</script>

</body>
</html>
